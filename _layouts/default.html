<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ page.title }} | {{ site.title }}</title>
  <meta name="author" content="{{ site.title }}">
  <meta name="description" content="{{ site.description }}">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,400;8..60,500;8..60,600;8..60,700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">
</head>
<body>

  {% assign u = page.url %}
  <header class="topnav">
    <div class="topnav-inner">
      <nav>
        <a href="{{ '/' | relative_url }}"                  class="{% if u == '/' %}active{% endif %}">Home</a>
        <a href="{{ '/about-me/' | relative_url }}"          class="{% if u contains 'about-me' %}active{% endif %}">About Me</a>
        <a href="{{ '/research/' | relative_url }}"          class="{% if u contains 'research' %}active{% endif %}">Research</a>
        <a href="{{ '/academic-projects/' | relative_url }}" class="{% if u contains 'academic-projects' %}active{% endif %}">Academic Projects</a>
      </nav>

      <div class="social">
        <a href="mailto:{{ site.email }}" title="Email" aria-label="Email">
          <svg viewBox="0 0 24 24" width="19" height="19" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="4" width="20" height="16" rx="2"/><path d="m22 7-10 5L2 7"/></svg>
        </a>
        <a href="https://github.com/{{ site.github_user }}" target="_blank" rel="noopener" title="GitHub" aria-label="GitHub">
          <svg viewBox="0 0 24 24" width="19" height="19" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 19c-5 1.5-5-2.5-7-3m14 6v-3.87a3.37 3.37 0 0 0-.94-2.61c3.14-.35 6.44-1.54 6.44-7A5.44 5.44 0 0 0 20 4.77 5.07 5.07 0 0 0 19.91 1S18.73.65 16 2.48a13.38 13.38 0 0 0-7 0C6.27.65 5.09 1 5.09 1A5.07 5.07 0 0 0 5 4.77a5.44 5.44 0 0 0-1.5 3.78c0 5.42 3.3 6.61 6.44 7A3.37 3.37 0 0 0 9 18.13V22"/></svg>
        </a>
        <a href="https://www.linkedin.com/in/{{ site.linkedin_user }}" target="_blank" rel="noopener" title="LinkedIn" aria-label="LinkedIn">
          <svg viewBox="0 0 24 24" width="19" height="19" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M16 8a6 6 0 0 1 6 6v7h-4v-7a2 2 0 0 0-2-2 2 2 0 0 0-2 2v7h-4v-7a6 6 0 0 1 6-6z"/><rect x="2" y="9" width="4" height="12"/><circle cx="4" cy="4" r="2"/></svg>
        </a>
      </div>
    </div>
  </header>

  <div class="wrap">
    <aside class="sidebar">
      <img class="avatar" src="{{ '/assets/images/Profile.jpeg' | relative_url }}" alt="Portrait of {{ site.title }}">

      <div class="name">{{ site.title }}</div>
      <div class="tagline">{{ site.tagline }}</div>

      <div class="meta">
        <div class="row">
          <div class="label">Contact</div>
          <a href="mailto:{{ site.email }}">{{ site.email }}</a>
        </div>
        <div class="row">
          <div class="label">GitHub</div>
          <a href="https://github.com/{{ site.github_user }}" target="_blank" rel="noopener">{{ site.github_user }}</a>
        </div>
        <div class="row">
          <div class="label">LinkedIn</div>
          <a href="https://www.linkedin.com/in/{{ site.linkedin_user }}" target="_blank" rel="noopener">{{ site.linkedin_user }}</a>
        </div>
        <div class="row">
          <div class="label">CV</div>
          <a href="{{ site.cv_path | relative_url }}" target="_blank" rel="noopener">Curriculum Vitae</a>
        </div>
      </div>
    </aside>

    <main>
      {{ content }}
    </main>
  </div>

</body>
</html>
